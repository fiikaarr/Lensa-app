<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Batang Atas Huruf T -->
  <path d="M12 16 h40 v9 h-40 z" fill="url(#redGrad)" filter="url(#shadow)" rx="2" />
  
  <!-- Batang Utama T yang Berubah Menjadi Elemen Gelombang Suara (Audio Wave / Equalizer) -->
  <!-- Bagian tengah T -->
  <rect x="27" y="27" width="10" height="25" rx="3" fill="url(#redGrad)" filter="url(#shadow)" />
  
  <!-- Gelombang Audio di Kiri T -->
  <rect x="18" y="33" width="5" height="13" rx="2" fill="url(#redGrad)" filter="url(#shadow)" opacity="0.85" />
  <rect x="10" y="37" width="5" height="7" rx="2" fill="url(#redGrad)" filter="url(#shadow)" opacity="0.6" />
  
  <!-- Gelombang Audio di Kanan T -->
  <rect x="41" y="33" width="5" height="13" rx="2" fill="url(#redGrad)" filter="url(#shadow)" opacity="0.85" />
  <rect x="49" y="37" width="5" height="7" rx="2" fill="url(#redGrad)" filter="url(#shadow)" opacity="0.6" />
</svg>
